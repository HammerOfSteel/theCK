# -----------------------------------------------------------------
# Deploy "The CK: Amelia V2" web build to Oracle Cloud
# -----------------------------------------------------------------
# Manual-only workflow (workflow_dispatch) — only repo collaborators
# with write access can trigger it.
#
# Strategy:
#   1. Downloads the Ren'Py SDK + Web Extension from GitHub releases
#   2. Runs `renpy.sh launcher web_build` to produce a complete web
#      build (renpy.wasm, renpy.data, renpy.js, game.zip, index.html…)
#   3. Deploys the entire web build to Oracle Cloud via SSH/rsync
#
# Required GitHub Secrets:
#   ORACLE_SSH_KEY  — contents of the PEM private key
#   ORACLE_HOST     — server IP (e.g. 129.151.193.219)
#   ORACLE_USER     — SSH user (e.g. ubuntu)
# -----------------------------------------------------------------

name: Deploy Amelia VN

on:
  workflow_dispatch:
    inputs:
      renpy_version:
        description: "Ren'Py SDK version (e.g. 8.3.7)"
        required: false
        default: "8.3.7"
        type: string
      renpy_tag:
        description: "GitHub release tag (e.g. 8.3.7.25031702)"
        required: false
        default: "8.3.7.25031702"
        type: string

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      RENPY_VERSION: ${{ inputs.renpy_version || '8.3.7' }}
      RENPY_TAG: ${{ inputs.renpy_tag || '8.3.7.25031702' }}
      DEPLOY_DIR: /home/ubuntu/renpy/TheCK_Amelia

    steps:
      # ── Checkout ──────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── System deps for headless Ren'Py ───────────────────────
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            xvfb libgl1 libglib2.0-0 libegl1 libxext6 libx11-6 \
            rsync openssh-client zip unzip

      # ── Ren'Py SDK (from GitHub releases) ─────────────────────
      - name: Download Ren'Py SDK
        run: |
          SDK_URL="https://github.com/renpy/renpy/releases/download/${RENPY_TAG}/renpy-${RENPY_VERSION}-sdk.tar.bz2"
          echo "Downloading Ren'Py SDK ${RENPY_VERSION}…"
          echo "  URL: ${SDK_URL}"
          wget -q --show-progress "${SDK_URL}" -O renpy-sdk.tar.bz2
          echo "Extracting SDK…"
          tar xjf renpy-sdk.tar.bz2
          mv renpy-*-sdk renpy-sdk
          rm renpy-sdk.tar.bz2
          echo "SDK ready: $(ls renpy-sdk/renpy.sh)"

      # ── Ren'Py Web Extension ──────────────────────────────────
      - name: Download Ren'Py Web Extension
        run: |
          WEB_URL="https://github.com/renpy/renpy/releases/download/${RENPY_TAG}/renpy-${RENPY_VERSION}-web.zip"
          echo "Downloading Ren'Py Web Extension…"
          echo "  URL: ${WEB_URL}"
          wget -q --show-progress "${WEB_URL}" -O renpy-web.zip
          echo "Extracting web extension into SDK…"
          unzip -q renpy-web.zip
          # The zip extracts a 'web/' directory — move it into the SDK
          mv web renpy-sdk/web
          rm renpy-web.zip
          echo "Web extension installed: $(ls renpy-sdk/web/)"

      # ── Run Ren'Py Web Build ──────────────────────────────────
      - name: Build web distribution
        run: |
          PROJECT_DIR="${GITHUB_WORKSPACE}/Amelia_V2"
          OUTPUT_DIR="${GITHUB_WORKSPACE}/web_build"

          echo "Running Ren'Py web_build…"
          echo "  Project: ${PROJECT_DIR}"
          echo "  Output:  ${OUTPUT_DIR}"

          xvfb-run -a ./renpy-sdk/renpy.sh \
            ./renpy-sdk/launcher \
            web_build \
            "${PROJECT_DIR}" \
            --destination "${OUTPUT_DIR}" \
            2>&1

          echo ""
          echo "=== Web build output ==="
          ls -lh "${OUTPUT_DIR}/"
          echo ""
          echo "game.zip size: $(du -h ${OUTPUT_DIR}/game.zip 2>/dev/null | cut -f1 || echo 'NOT FOUND')"

      # ── Random presplash image ────────────────────────────────
      - name: Randomise web presplash
        run: |
          PRESPLASH_DIR="${GITHUB_WORKSPACE}/Amelia_V2/game/images/web_presplash"
          OUTPUT_DIR="${GITHUB_WORKSPACE}/web_build"

          # Collect candidate images
          IMAGES=( "${PRESPLASH_DIR}"/* )
          COUNT=${#IMAGES[@]}
          PICK=$(( RANDOM % COUNT ))
          CHOSEN="${IMAGES[$PICK]}"

          echo "Presplash candidates (${COUNT}):"
          printf '  %s\n' "${IMAGES[@]}"
          echo "Randomly chose: $(basename "${CHOSEN}")"

          # Replace the default presplash in the web build output
          cp "${CHOSEN}" "${OUTPUT_DIR}/web-presplash.jpg"
          echo "web-presplash.jpg updated ($(du -h "${OUTPUT_DIR}/web-presplash.jpg" | cut -f1))"

      # ── Setup SSH ─────────────────────────────────────────────
      - name: Setup SSH connection
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ORACLE_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          cat > ~/.ssh/config <<EOF
          Host oracle
            HostName ${{ secrets.ORACLE_HOST }}
            User ${{ secrets.ORACLE_USER }}
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF
          chmod 600 ~/.ssh/config

          # Test connection
          ssh oracle "echo 'SSH connection OK'"

      # ── Deploy ────────────────────────────────────────────────
      - name: Deploy to Oracle Cloud
        run: |
          echo "Deploying web build to Oracle Cloud…"

          # Sync the entire web build output to the server
          # This replaces ALL web runtime files (renpy.wasm, .js, .data,
          # game.zip, index.html, etc.) ensuring everything is consistent.
          rsync -az --delete \
            --exclude='saves/' \
            "${GITHUB_WORKSPACE}/web_build/" \
            oracle:${DEPLOY_DIR}/

          # Restart only the renpy container (does NOT touch bifrost/fauke!)
          echo "Restarting VN container…"
          ssh oracle "cd /home/ubuntu/renpy && sudo docker compose restart"

          echo ""
          echo "Deployment complete — https://amelia.dancingsalamanders.com"

      # ── Cleanup ───────────────────────────────────────────────
      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
