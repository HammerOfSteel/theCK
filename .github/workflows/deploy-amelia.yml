# -----------------------------------------------------------------
# Deploy "The CK: Amelia V2" web build to Oracle Cloud
# -----------------------------------------------------------------
# Manual-only workflow (workflow_dispatch) — only repo collaborators
# with write access can trigger it.
#
# Strategy:
#   1. Downloads the Ren'Py SDK from GitHub releases
#   2. Compiles .rpy → .rpyc and packages game.zip
#   3. Deploys game.zip to the Oracle Cloud host via SSH
#      (the web runtime — renpy.js/wasm/data/index.html — stays as-is)
#
# Required GitHub Secrets:
#   ORACLE_SSH_KEY  — contents of the PEM private key
#   ORACLE_HOST     — server IP (e.g. 129.151.193.219)
#   ORACLE_USER     — SSH user (e.g. ubuntu)
# -----------------------------------------------------------------

name: Deploy Amelia VN

on:
  workflow_dispatch:
    inputs:
      renpy_version:
        description: "Ren'Py SDK version"
        required: false
        default: "8.3.7"
        type: string
      renpy_tag:
        description: "GitHub release tag (full tag, e.g. 8.3.7.25031702)"
        required: false
        default: "8.3.7.25031702"
        type: string

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      RENPY_VERSION: ${{ inputs.renpy_version || '8.3.7' }}
      RENPY_TAG: ${{ inputs.renpy_tag || '8.3.7.25031702' }}
      DEPLOY_DIR: /home/ubuntu/renpy/TheCK_Amelia

    steps:
      # ── Checkout ──────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── System deps for headless Ren'Py ───────────────────────
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            xvfb libgl1 libglib2.0-0 libegl1 libxext6 libx11-6 \
            rsync openssh-client zip

      # ── Ren'Py SDK (from GitHub releases — fast & reliable) ──
      - name: Download Ren'Py SDK
        run: |
          SDK_URL="https://github.com/renpy/renpy/releases/download/${RENPY_TAG}/renpy-${RENPY_VERSION}-sdk.tar.bz2"
          echo "Downloading Ren'Py SDK ${RENPY_VERSION} from GitHub releases…"
          echo "  URL: ${SDK_URL}"
          wget -q --show-progress "${SDK_URL}" -O renpy-sdk.tar.bz2
          echo "Extracting…"
          tar xjf renpy-sdk.tar.bz2
          mv renpy-*-sdk renpy-sdk
          echo "RENPY_SDK=${GITHUB_WORKSPACE}/renpy-sdk" >> "$GITHUB_ENV"
          echo "SDK ready: $(ls renpy-sdk/renpy.sh)"

      # ── Compile .rpy → .rpyc ─────────────────────────────────
      - name: Compile Ren'Py scripts
        run: |
          PROJECT_DIR="${GITHUB_WORKSPACE}/Amelia_V2"
          echo "Compiling .rpy files in ${PROJECT_DIR}…"
          xvfb-run -a ./renpy-sdk/renpy.sh "${PROJECT_DIR}" compile 2>&1 || true

          # Verify .rpyc files were produced
          RPYC_COUNT=$(find "${PROJECT_DIR}/game" -name '*.rpyc' | wc -l)
          echo "Found ${RPYC_COUNT} .rpyc files"
          if [ "$RPYC_COUNT" -eq 0 ]; then
            echo "WARNING: No .rpyc files found. Ren'Py may have failed to compile."
            echo "Attempting alternative compile method…"
            xvfb-run -a ./renpy-sdk/renpy.sh "${PROJECT_DIR}" quit 2>&1 || true
            RPYC_COUNT=$(find "${PROJECT_DIR}/game" -name '*.rpyc' | wc -l)
            echo "After retry: ${RPYC_COUNT} .rpyc files"
          fi

      # ── Package game.zip ──────────────────────────────────────
      - name: Package game.zip
        run: |
          PROJECT_DIR="${GITHUB_WORKSPACE}/Amelia_V2"
          cd "${PROJECT_DIR}/game"

          echo "Creating game.zip from game directory…"

          # Include all game files — scripts (.rpyc), assets, audio, etc.
          # Exclude source .rpy files to keep size down (rpyc is sufficient)
          # Exclude dev files, caches, saves
          zip -r "${GITHUB_WORKSPACE}/game.zip" . \
            -x "*.rpy" \
            -x "cache/*" \
            -x "saves/*" \
            -x "*.bak" \
            -x "**/.gitkeep"

          ls -lh "${GITHUB_WORKSPACE}/game.zip"
          echo "game.zip ready ($(du -h ${GITHUB_WORKSPACE}/game.zip | cut -f1))"

      # ── Setup SSH ─────────────────────────────────────────────
      - name: Setup SSH connection
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ORACLE_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          cat > ~/.ssh/config <<EOF
          Host oracle
            HostName ${{ secrets.ORACLE_HOST }}
            User ${{ secrets.ORACLE_USER }}
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF
          chmod 600 ~/.ssh/config

          # Test connection
          ssh oracle "echo 'SSH connection OK'"

      # ── Deploy ────────────────────────────────────────────────
      - name: Deploy to Oracle Cloud
        run: |
          echo "Deploying to Oracle Cloud…"

          # Upload game.zip (this is the only file that changes per deploy)
          echo "Uploading game.zip…"
          scp "${GITHUB_WORKSPACE}/game.zip" oracle:${DEPLOY_DIR}/game.zip

          # Also sync the game/ directory for progressive download mode
          echo "Syncing game assets…"
          rsync -az --delete \
            --exclude='*.rpy' \
            --exclude='cache/' \
            --exclude='saves/' \
            --exclude='.gitkeep' \
            "${GITHUB_WORKSPACE}/Amelia_V2/game/" \
            oracle:${DEPLOY_DIR}/game/

          # Restart only the renpy container (does NOT touch bifrost/fauke!)
          echo "Restarting VN container…"
          ssh oracle "cd /home/ubuntu/renpy && sudo docker compose restart"

          echo "Deployment complete — https://amelia.dancingsalamanders.com"

      # ── Cleanup ───────────────────────────────────────────────
      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
